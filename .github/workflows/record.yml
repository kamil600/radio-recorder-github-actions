name: Radio Recorder

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci

      - name: Execute Recording Script
        env:
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          RADIO_STREAM_URL: ${{ vars.RADIO_STREAM_URL }}
          RECORD_DURATION_SECONDS: ${{ vars.RECORD_DURATION_SECONDS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
        run: npm run record
 
