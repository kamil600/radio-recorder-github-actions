name: Radio Auto Recorder

on:
  schedule:
    - cron: '0 6 * * *' # Codziennie o 18:00 UTC
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci

      - name: Execute Recording Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET_NAME: "recordings"
          RADIO_STREAM_URL: ${{ secrets.RADIO_STREAM_URL }}
          RECORD_DURATION_SECONDS: "3600" # Czas nagrania w sekundach (3600s = 60 min)
          RETENTION_DAYS: "7"              # Dni przechowywania nagrań
        run: npm run record
        
