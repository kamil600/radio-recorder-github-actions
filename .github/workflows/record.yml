name: Radio Recorder

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci

      - name: Execute Recording Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET_NAME: "recordings"
          RADIO_STREAM_URL: ${{ secrets.RADIO_STREAM_URL }}
          RECORD_DURATION_SECONDS: ${{ vars.RECORD_DURATION_SECONDS }}
          RETENTION_DAYS: "7"
        run: npm run record
 
