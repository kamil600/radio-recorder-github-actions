<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archiwum Nagrań Radiowych</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen p-6 transition-colors duration-200">
  <div class="max-w-3xl mx-auto">
    <header class="mb-8 border-b border-gray-200 dark:border-gray-800 pb-4 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-emerald-600 dark:text-emerald-400">📻 Audycje Radiowe</h1>
        <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">Przechowywane na Supabase Storage</p>
      </div>
      <div class="flex flex-col items-end gap-2">
        <button id="refreshBtn" class="w-full bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded-lg text-sm border border-gray-300 dark:border-gray-700 transition shadow-sm text-center">
          🔄 Odśwież
        </button>
        <button id="themeToggleBtn" class="w-full bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded-lg text-sm border border-gray-300 dark:border-gray-700 transition flex items-center justify-center gap-1.5 shadow-sm">
          <span id="themeIcon">🌙</span> <span id="themeLabel">Ciemny</span>
        </button>
      </div>
    </header>

    <main id="app">
      <div id="loading" class="text-center py-12 text-gray-500 dark:text-gray-400">Ładowanie audycji...</div>
      <div id="error" class="hidden bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-500/50 text-red-800 dark:text-red-200 p-4 rounded-xl text-center my-4"></div>
      <div id="list" class="space-y-4 hidden"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
